<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="cat_bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F1F5F9"/></linearGradient>
    <linearGradient id="cat_yellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FACC15"/><stop offset="100%" stop-color="#EAB308"/></linearGradient>
    <linearGradient id="cat_base" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#020617"/><stop offset="100%" stop-color="#0F172A"/></linearGradient>
  </defs>
  <!-- Studio Canvas Background -->
  <rect width="400" height="300" fill="url(#cat_bg)" rx="10" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Floor Contact Shadow -->
  <ellipse cx="200" cy="268" rx="170" ry="10" fill="#0F172A" opacity="0.08"/>

  <!-- Caterpillar Heavy Black Skid Base -->
  <rect x="30" y="222" width="340" height="38" rx="4" fill="url(#cat_base)"/>
  <rect x="60" y="236" width="65" height="12" rx="2" fill="#334155"/>
  <rect x="275" y="236" width="65" height="12" rx="2" fill="#334155"/>

  <!-- Caterpillar Highway Yellow Canopy -->
  <rect x="38" y="62" width="324" height="162" rx="8" fill="url(#cat_yellow)" stroke="#CA8A04" stroke-width="2"/>

  <!-- Top Exhaust Muffler & Silencer Hood -->
  <rect x="80" y="42" width="45" height="22" rx="4" fill="#334155"/>
  <rect x="86" y="32" width="32" height="10" fill="#0F172A"/>

  <!-- Heavy Duty Hinged Access Doors -->
  <rect x="52" y="78" width="138" height="132" rx="4" fill="none" stroke="#854D0E" stroke-width="1.5"/>
  <rect x="204" y="78" width="142" height="132" rx="4" fill="none" stroke="#854D0E" stroke-width="1.5"/>

  <rect x="178" y="142" width="8" height="18" rx="2" fill="#0F172A"/>
  <rect x="334" y="142" width="8" height="18" rx="2" fill="#0F172A"/>

  <!-- Black Air Intake Louver Grille -->
  <rect x="65" y="92" width="112" height="52" rx="4" fill="#0F172A"/>
  <line x1="75" y1="102" x2="165" y2="102" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="75" y1="114" x2="165" y2="114" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="75" y1="126" x2="165" y2="126" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="75" y1="138" x2="165" y2="138" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Iconic CAT Logo & Triangle Badge -->
  <rect x="65" y="156" width="112" height="38" rx="3" fill="#0F172A"/>
  <polygon points="76,186 92,186 84,166" fill="#FACC15"/>
  <text x="132" y="183" font-family="'Barlow', Arial Black, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" text-anchor="middle">CAT</text>

  <!-- CAT EMCP 4.1 Digital Panel -->
  <rect x="225" y="90" width="105" height="60" rx="4" fill="#020617" stroke="#334155" stroke-width="2"/>
  <rect x="235" y="98" width="85" height="26" rx="2" fill="#0284C7"/>
  <text x="277" y="115" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#E0F2FE" text-anchor="middle">EMCP 4.1</text>
  <circle cx="250" cy="138" r="4" fill="#22C55E"/>
  <circle cx="277" cy="138" r="4" fill="#FACC15"/>
  <circle cx="305" cy="138" r="4" fill="#EF4444"/>

  <!-- Model Decal -->
  <text x="277" y="178" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="14" fill="#0F172A" text-anchor="middle" letter-spacing="1">DE150E0 • 150kVA</text>
  <text x="277" y="196" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#713F12" text-anchor="middle">CAT C7.1 IN-LINE 6</text>
</svg>