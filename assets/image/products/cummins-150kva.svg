    <linearGradient id="c_base" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#020617"/><stop offset="100%" stop-color="#0F172A"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="#0F172A"/>
