  <text x="85" y="165" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="14" fill="#F59E0B" letter-spacing="1">C150D5 • 150 kVA</text>
  <text x="85" y="182" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">6BTA5.9 HEAVY TURBO</text>
