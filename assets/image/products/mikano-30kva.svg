<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="m_canopy" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#E2E8F0"/></linearGradient>
    <linearGradient id="m_base" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0F172A"/><stop offset="100%" stop-color="#1E293B"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="#0F172A"/>
  <!-- Heavy Skid Base -->
  <rect x="35" y="225" width="330" height="30" rx="4" fill="url(#m_base)"/>
  <rect x="65" y="235" width="60" height="12" rx="2" fill="#334155"/>
  <rect x="275" y="235" width="60" height="12" rx="2" fill="#334155"/>
  <!-- Soundproof Canopy Body -->
  <rect x="45" y="70" width="310" height="155" rx="10" fill="url(#m_canopy)"/>
  <!-- Top Exhaust Silencer Outlet -->
  <rect x="90" y="52" width="35" height="20" rx="3" fill="#334155"/>
  <rect x="95" y="42" width="25" height="10" fill="#0F172A"/>
  <circle cx="245" cy="60" r="8" fill="#334155"/>
  <!-- Lockable Maintenance Access Doors -->
  <rect x="60" y="85" width="125" height="125" rx="4" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <rect x="170" y="145" width="8" height="15" rx="2" fill="#334155"/>
  <rect x="200" y="85" width="135" height="125" rx="4" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <rect x="320" y="145" width="8" height="15" rx="2" fill="#334155"/>
  <!-- Air Intake Louvers (Ventilation) -->
  <line x1="75" y1="105" x2="150" y2="105" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
  <line x1="75" y1="118" x2="150" y2="118" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
  <line x1="75" y1="131" x2="150" y2="131" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
  <line x1="75" y1="144" x2="150" y2="144" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
  <!-- Deep Sea Digital Controller Glass Window -->
  <rect x="220" y="100" width="70" height="45" rx="4" fill="#020617" stroke="#334155" stroke-width="3"/>
  <rect x="230" y="108" width="50" height="20" rx="2" fill="#0284C7"/>
  <circle cx="240" cy="136" r="3" fill="#22C55E"/>
  <circle cx="255" cy="136" r="3" fill="#EF4444"/>
  <!-- Mikano Brand Decal -->
  <text x="270" y="185" font-family="'Barlow', Arial Black" font-weight="900" font-size="18" font-style="italic" fill="#0135AB" text-anchor="middle">MIKANO</text>
  <text x="270" y="198" font-family="'Inter', sans-serif" font-weight="800" font-size="9" fill="#D97706" text-anchor="middle" letter-spacing="1">30 kVA SOUNDPROOF</text>
</svg>