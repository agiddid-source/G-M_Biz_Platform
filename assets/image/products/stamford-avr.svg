<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="avr_bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F1F5F9"/></linearGradient>
    <linearGradient id="avr_board" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1E293B"/><stop offset="100%" stop-color="#0F172A"/></linearGradient>
    <linearGradient id="avr_sink" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#D97706"/><stop offset="50%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#B45309"/></linearGradient>
  </defs>
  <!-- Studio Canvas Background -->
  <rect width="400" height="300" fill="url(#avr_bg)" rx="10" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Floor Contact Shadow -->
  <ellipse cx="200" cy="265" rx="140" ry="10" fill="#0F172A" opacity="0.08"/>

  <!-- Heavy Black Resin Potting Case -->
  <rect x="70" y="50" width="260" height="200" rx="10" fill="url(#avr_board)" stroke="#334155" stroke-width="3"/>

  <!-- Gold Anodized Aluminum Heat Sink -->
  <rect x="90" y="70" width="95" height="115" rx="4" fill="url(#avr_sink)"/>
  <line x1="105" y1="70" x2="105" y2="185" stroke="#78350F" stroke-width="2.5"/>
  <line x1="120" y1="70" x2="120" y2="185" stroke="#78350F" stroke-width="2.5"/>
  <line x1="135" y1="70" x2="135" y2="185" stroke="#78350F" stroke-width="2.5"/>
  <line x1="150" y1="70" x2="150" y2="185" stroke="#78350F" stroke-width="2.5"/>
  <line x1="165" y1="70" x2="165" y2="185" stroke="#78350F" stroke-width="2.5"/>

  <!-- Potentiometer Adjustment Trimmers -->
  <circle cx="225" cy="90" r="12" fill="#020617" stroke="#64748B" stroke-width="2"/>
  <line x1="220" y1="90" x2="230" y2="90" stroke="#F59E0B" stroke-width="2"/>
  <text x="245" y="93" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#CBD5E1">VOLT</text>
  
  <circle cx="225" cy="125" r="12" fill="#020617" stroke="#64748B" stroke-width="2"/>
  <line x1="220" y1="125" x2="230" y2="125" stroke="#F59E0B" stroke-width="2"/>
  <text x="245" y="128" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#CBD5E1">STAB</text>

  <circle cx="225" cy="160" r="12" fill="#020617" stroke="#64748B" stroke-width="2"/>
  <line x1="220" y1="160" x2="230" y2="160" stroke="#F59E0B" stroke-width="2"/>
  <text x="245" y="163" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#CBD5E1">UFRO</text>

  <!-- Screw Terminal Strip with Brass Screws -->
  <rect x="90" y="200" width="220" height="35" rx="4" fill="#020617" stroke="#475569" stroke-width="1.5"/>
  <circle cx="110" cy="217" r="6" fill="#F59E0B" stroke="#78350F" stroke-width="2"/>
  <circle cx="135" cy="217" r="6" fill="#F59E0B" stroke="#78350F" stroke-width="2"/>
  <circle cx="160" cy="217" r="6" fill="#F59E0B" stroke="#78350F" stroke-width="2"/>
  <circle cx="185" cy="217" r="6" fill="#F59E0B" stroke="#78350F" stroke-width="2"/>
  <circle cx="210" cy="217" r="6" fill="#F59E0B" stroke="#78350F" stroke-width="2"/>
  <circle cx="235" cy="217" r="6" fill="#F59E0B" stroke="#78350F" stroke-width="2"/>
  <circle cx="260" cy="217" r="6" fill="#F59E0B" stroke="#78350F" stroke-width="2"/>
  <circle cx="285" cy="217" r="6" fill="#F59E0B" stroke="#78350F" stroke-width="2"/>

  <!-- Stamford Logo Decal -->
  <text x="300" y="75" font-family="'Barlow', Arial Black, sans-serif" font-weight="900" font-size="14" fill="#38BDF8" text-anchor="end">STAMFORD</text>
  <text x="300" y="90" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#F59E0B" text-anchor="end">SX460</text>
</svg>