<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="po_bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F1F5F9"/></linearGradient>
    <linearGradient id="po_body" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0F172A"/><stop offset="50%" stop-color="#1E293B"/><stop offset="100%" stop-color="#020617"/></linearGradient>
    <linearGradient id="po_gasket" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#DC2626"/><stop offset="100%" stop-color="#991B1B"/></linearGradient>
  </defs>
  <!-- Studio Canvas Background -->
  <rect width="400" height="300" fill="url(#po_bg)" rx="10" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Floor Contact Shadow -->
  <ellipse cx="200" cy="265" rx="80" ry="8" fill="#0F172A" opacity="0.08"/>

  <!-- Top Rubber Sealing Gasket Ring -->
  <rect x="145" y="40" width="110" height="12" rx="4" fill="url(#po_gasket)"/>
  <rect x="160" y="32" width="80" height="10" rx="3" fill="#64748B"/>
  <circle cx="200" cy="37" r="8" fill="#0F172A" stroke="#94A3B8" stroke-width="2"/>

  <!-- Spin-on Canister Body -->
  <rect x="135" y="52" width="130" height="185" rx="14" fill="url(#po_body)" stroke="#334155" stroke-width="1.5"/>

  <!-- Fluted Hex Grip at Bottom for Filter Wrench -->
  <polygon points="140,237 260,237 250,252 150,252" fill="#020617" stroke="#334155" stroke-width="1"/>

  <!-- Genuine Perkins Decal Label -->
  <rect x="145" y="90" width="110" height="115" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="200" y="118" font-family="'Barlow', Arial Black, sans-serif" font-weight="900" font-size="16" fill="#0135AB" text-anchor="middle">Perkins</text>
  <line x1="155" y1="126" x2="245" y2="126" stroke="#E2E8F0" stroke-width="1"/>
  <text x="200" y="148" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="17" fill="#0F172A" text-anchor="middle">2654403</text>
  <text x="200" y="166" font-family="'Inter', sans-serif" font-size="8" font-weight="800" fill="#DC2626" text-anchor="middle" letter-spacing="1">OIL FILTER ELEMENT</text>
  <text x="200" y="182" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#64748B" text-anchor="middle">20 MICRON • GENUINE UK</text>
  <text x="200" y="194" font-family="'JetBrains Mono', monospace" font-size="7" fill="#94A3B8" text-anchor="middle">3/4-16 UNF THREAD</text>
</svg>