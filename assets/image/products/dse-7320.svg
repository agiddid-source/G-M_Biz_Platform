<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#0F172A"/>
  <!-- Bezel Fascia Frame -->
  <rect x="50" y="40" width="300" height="220" rx="10" fill="#1E293B" stroke="#475569" stroke-width="6"/>
  <!-- Deep Sea Blue Header Stripe -->
  <rect x="56" y="46" width="288" height="22" fill="#0035AB"/>
  <text x="70" y="62" font-family="'Barlow', Arial Black" font-weight="900" font-size="12" fill="#FFFFFF">DEEP SEA ELECTRONICS</text>
  <text x="330" y="62" font-family="'JetBrains Mono'" font-weight="700" font-size="11" fill="#F59E0B" text-anchor="end">DSE7320 MKII</text>
  <!-- Graphical LCD Backlit Display -->
  <rect x="75" y="78" width="250" height="105" rx="4" fill="#0369A1" stroke="#0F172A" stroke-width="4"/>
  <text x="88" y="105" font-family="'JetBrains Mono'" font-size="12" font-weight="700" fill="#E0F2FE">GEN L1-N: 231V  50.0Hz</text>
  <text x="88" y="125" font-family="'JetBrains Mono'" font-size="12" font-weight="700" fill="#E0F2FE">GEN L2-N: 230V  50.0Hz</text>
  <text x="88" y="145" font-family="'JetBrains Mono'" font-size="12" font-weight="700" fill="#E0F2FE">LOAD: 42.5kW (84%)</text>
  <text x="88" y="168" font-family="'JetBrains Mono'" font-size="11" font-weight="700" fill="#FEF08A">AUTO MODE • ALL SYSTEMS NORMAL</text>
  <!-- Tactile Control Buttons -->
  <circle cx="100" cy="222" r="16" fill="#16A34A" stroke="#FFFFFF" stroke-width="2"/>
  <text x="100" y="226" font-family="'Inter'" font-weight="900" font-size="10" fill="#FFFFFF" text-anchor="middle">START</text>
  
  <circle cx="145" cy="222" r="16" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/>
  <text x="145" y="226" font-family="'Inter'" font-weight="900" font-size="10" fill="#FFFFFF" text-anchor="middle">STOP</text>
  
  <rect x="180" y="206" width="40" height="32" rx="4" fill="#475569" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="200" y="226" font-family="'Inter'" font-weight="800" font-size="9" fill="#FFFFFF" text-anchor="middle">AUTO</text>

  <rect x="230" y="206" width="40" height="32" rx="4" fill="#475569" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="250" y="226" font-family="'Inter'" font-weight="800" font-size="9" fill="#FFFFFF" text-anchor="middle">MAN</text>

  <circle cx="305" cy="222" r="16" fill="#0284C7" stroke="#FFFFFF" stroke-width="2"/>
  <text x="305" y="226" font-family="'Inter'" font-weight="900" font-size="9" fill="#FFFFFF" text-anchor="middle">MENU</text>
</svg>