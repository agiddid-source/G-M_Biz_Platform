<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="f_bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F1F5F9"/></linearGradient>
    <linearGradient id="f_tank" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FBBF24"/><stop offset="100%" stop-color="#D97706"/></linearGradient>
    <linearGradient id="f_frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#334155"/><stop offset="100%" stop-color="#0F172A"/></linearGradient>
    <linearGradient id="f_eng" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#64748B"/><stop offset="100%" stop-color="#1E293B"/></linearGradient>
  </defs>
  <!-- Studio Canvas Background -->
  <rect width="400" height="300" fill="url(#f_bg)" rx="10" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Floor Contact Shadow -->
  <ellipse cx="200" cy="270" rx="150" ry="10" fill="#0F172A" opacity="0.08"/>

  <!-- Steel Roll Cage -->
  <rect x="50" y="45" width="300" height="210" rx="14" fill="none" stroke="url(#f_frame)" stroke-width="14"/>
  <line x1="60" y1="145" x2="340" y2="145" stroke="url(#f_frame)" stroke-width="10"/>

  <!-- Yellow Fuel Tank -->
  <rect x="75" y="55" width="250" height="55" rx="8" fill="url(#f_tank)"/>
  <rect x="175" y="48" width="50" height="8" rx="2" fill="#1E293B"/>
  <text x="200" y="90" font-family="'Barlow', Arial Black, sans-serif" font-weight="900" font-size="20" fill="#0F172A" text-anchor="middle" letter-spacing="2">FIRMAN 10kVA</text>

  <!-- Engine Block -->
  <rect x="85" y="120" width="140" height="115" rx="6" fill="url(#f_eng)"/>
  <!-- Cooling Fins -->
  <line x1="95" y1="135" x2="215" y2="135" stroke="#94A3B8" stroke-width="2.5"/>
  <line x1="95" y1="150" x2="215" y2="150" stroke="#94A3B8" stroke-width="2.5"/>
  <line x1="95" y1="165" x2="215" y2="165" stroke="#94A3B8" stroke-width="2.5"/>
  <line x1="95" y1="180" x2="215" y2="180" stroke="#94A3B8" stroke-width="2.5"/>

  <!-- Copper Alternator Bell -->
  <rect x="230" y="130" width="85" height="95" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="272" cy="177" r="24" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-dasharray="6 4"/>
  <text x="272" y="181" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#F59E0B" text-anchor="middle">COPPER</text>

  <!-- Front Control Panel -->
  <rect x="90" y="185" width="130" height="45" rx="4" fill="#0F172A"/>
  <circle cx="115" cy="205" r="8" fill="#EF4444"/>
  <rect x="140" y="197" width="30" height="16" rx="2" fill="#38BDF8"/>
  <circle cx="195" cy="205" r="5" fill="#10B981"/>

  <!-- Wheels & Wheel Hubs -->
  <circle cx="80" cy="255" r="26" fill="#1E293B" stroke="#475569" stroke-width="7"/>
  <circle cx="80" cy="255" r="10" fill="#F59E0B"/>
  <circle cx="320" cy="255" r="26" fill="#1E293B" stroke="#475569" stroke-width="7"/>
  <circle cx="320" cy="255" r="10" fill="#F59E0B"/>
</svg>