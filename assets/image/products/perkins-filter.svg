<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="p_flt" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#E2E8F0"/><stop offset="40%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#CBD5E1"/></linearGradient>
    <linearGradient id="p_glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/><stop offset="100%" stop-color="#0284C7" stop-opacity="0.8"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="#0F172A"/>
  <!-- Top Mounting Head -->
  <rect x="145" y="35" width="110" height="18" rx="4" fill="#334155"/>
  <!-- Main Canister -->
  <rect x="135" y="50" width="130" height="140" rx="8" fill="url(#p_flt)"/>
  <!-- Perkins Label Decal -->
  <text x="200" y="95" font-family="'Barlow', Arial Black" font-weight="900" font-size="18" fill="#0035AB" text-anchor="middle">Perkins</text>
  <text x="200" y="115" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="16" fill="#0F172A" text-anchor="middle">26560201</text>
  <text x="200" y="135" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#D97706" text-anchor="middle" letter-spacing="1">FUEL / WATER SEPARATOR</text>
  <text x="200" y="155" font-family="'Inter', sans-serif" font-size="7" fill="#64748B" text-anchor="middle">GENUINE UK SPEC</text>
  <!-- Clear Glass Water Trap Bowl -->
  <rect x="145" y="190" width="110" height="45" rx="8" fill="url(#p_glass)" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="200" y="215" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">SEDIMENT TRAP</text>
  <!-- Bottom Drain Valve -->
  <rect x="190" y="235" width="20" height="18" rx="3" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <line x1="185" y1="244" x2="215" y2="244" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
</svg>